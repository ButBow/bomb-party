<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14121f" />
  <title>Club Bombe Spiel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>" />
  <link rel="stylesheet" href="karten.css" />
  <link rel="stylesheet" href="/music.css" />
</head>
<body>
  <!-- ── Lobby: du + deine Bomben-Karte ── -->
  <main id="lobby">
    <div class="club">
      <img src="/brand/wappen.svg" alt="Wappen" class="crest" />
      <img src="/brand/vwbb-logo.png" alt="Von Wien bis Berlin" class="club-logo" />
      <span class="club-tag">ClubApp</span>
    </div>
    <h1 id="title">Club Bombe Spiel</h1>
    <p id="tagline"></p>

    <section class="step">
      <h2>1 · Du</h2>
      <label class="avatar-pick">
        <canvas id="avatar-preview" width="160" height="160"></canvas>
        <span>📸 Foto von dir</span>
        <input id="avatar-input" type="file" accept="image/*" capture="user" hidden />
      </label>
      <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="nickname" />
    </section>

    <section class="step">
      <h2>2 · Deine Bomben-Karte 💣</h2>
      <p class="hint">Zeichne sie selbst – und bau ihre Fähigkeit aus max. 2 Effekten.</p>
      <div class="builder">
        <div class="draw-wrap">
          <canvas id="draw" width="300" height="300"></canvas>
          <div class="draw-tools">
            <span id="pens"></span>
            <button id="draw-clear" type="button">🧽</button>
            <label class="btn-like">🖼️<input id="draw-upload" type="file" accept="image/*" hidden /></label>
          </div>
        </div>
        <div class="fx">
          <input id="special-name" maxlength="24" placeholder="Name der Karte" />
          <div id="effects"></div>
          <p id="special-desc" class="desc"></p>
        </div>
      </div>
    </section>

    <section class="step">
      <h2>3 · Tisch wählen</h2>
      <div id="tables"><p class="hint">Suche offene Tische …</p></div>
      <div class="new-table">
        <input id="room" maxlength="20" placeholder="Name für neuen Tisch" />
        <button id="join" class="primary">➕ Neuer Tisch</button>
      </div>
      <p id="error"></p>
      <p class="hint"><a href="editor.html">✏️ Charakterkarten-Bilder hochladen</a> · <a href="/">💣 Bomb Party</a></p>
    </section>
  </main>

  <!-- ── Der Tisch (Ego-Perspektive) ── -->
  <section id="table" hidden>
    <div id="felt-wrap"><div id="felt"></div></div>
    <div id="club-badge"><img src="/brand/wappen.svg" alt="" /><img src="/brand/vwbb-logo.png" alt="" class="wm-logo" /></div>
    <button id="chat-btn" aria-label="Chat">💬<span id="chat-unread" hidden></span></button>
    <aside id="chat" hidden>
      <header><b>💬 Tisch-Chat</b><button id="chat-close" aria-label="Schließen">✕</button></header>
      <ol id="chat-list"></ol>
      <div class="chat-quick"></div>
      <form id="chat-form"><input id="chat-input" maxlength="200" placeholder="Nachricht …" autocomplete="off" /><button>➤</button></form>
    </aside>
    <div id="fx-banner"></div>
    <div id="players"></div>
    <div id="center">
      <div id="pile"></div>
      <div id="pile-info"></div>
      <div id="ticker"></div>
    </div>
    <ol id="log"></ol>
    <div id="actions">
      <button id="start" class="primary" hidden>▶️ Spiel starten</button>
      <button id="take">🗑️ Stapel nehmen</button>
      <button id="play" class="primary">Legen ⬆️</button>
    </div>
    <div id="pov">
      <!-- Arme + Handflächen liegen HINTER den Karten … -->
      <svg class="arm left" viewBox="0 0 300 300" aria-hidden="true">
        <path class="sleeve" d="M-40 330 L-40 210 L150 120 L210 205 L60 330 Z" />
        <path class="cuff" d="M128 128 L168 108 L222 188 L186 214 Z" />
        <ellipse class="glove" cx="205" cy="128" rx="58" ry="52" />
        <path class="glove" d="M220 80 q30 -20 52 -4 q12 14 -8 26 l-30 14 z" />
      </svg>
      <svg class="arm right" viewBox="0 0 300 300" aria-hidden="true">
        <path class="sleeve" d="M-40 330 L-40 210 L150 120 L210 205 L60 330 Z" />
        <path class="cuff" d="M128 128 L168 108 L222 188 L186 214 Z" />
        <ellipse class="glove" cx="205" cy="128" rx="58" ry="52" />
        <path class="glove" d="M220 80 q30 -20 52 -4 q12 14 -8 26 l-30 14 z" />
      </svg>
      <div id="hand"></div>
      <!-- … nur die Daumen liegen DRÜBER, wie beim echten Halten -->
      <svg class="thumb left" viewBox="0 0 120 120" aria-hidden="true">
        <path class="glove" d="M18 104 C 8 80, 30 50, 62 26 C 78 14, 100 22, 96 40 C 92 54, 70 66, 56 90 C 46 108, 26 116, 18 104 Z" />
        <path class="crease" d="M58 46 q10 6 18 2" />
      </svg>
      <svg class="thumb right" viewBox="0 0 120 120" aria-hidden="true">
        <path class="glove" d="M18 104 C 8 80, 30 50, 62 26 C 78 14, 100 22, 96 40 C 92 54, 70 66, 56 90 C 46 108, 26 116, 18 104 Z" />
        <path class="crease" d="M58 46 q10 6 18 2" />
      </svg>
    </div>
    <div id="explain" hidden></div>
    <div id="turn-banner">DU BIST DRAN</div>
    <div id="intro" class="overlay" hidden></div>
    <div id="ranking" class="overlay" hidden></div>
    <div id="picker" class="overlay" hidden></div>
    <div id="toast"></div>
  </section>

  <script type="module" src="/js/music.js"></script>
  <script type="module" src="karten.js"></script>
</body>
</html>
