<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14121f" />
  <title>TOPP DAS!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>" />
  <link rel="stylesheet" href="karten.css" />
</head>
<body>
  <!-- ── Lobby: du + deine Bomben-Karte ── -->
  <main id="lobby">
    <h1 id="title">TOPP DAS!</h1>
    <p id="tagline"></p>

    <section class="step">
      <h2>1 · Du</h2>
      <label class="avatar-pick">
        <canvas id="avatar-preview" width="160" height="160"></canvas>
        <span>📸 Foto von dir</span>
        <input id="avatar-input" type="file" accept="image/*" capture="user" hidden />
      </label>
      <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="nickname" />
    </section>

    <section class="step">
      <h2>2 · Deine Bomben-Karte 💣</h2>
      <p class="hint">Zeichne sie selbst – und bau ihre Fähigkeit aus max. 2 Effekten.</p>
      <div class="builder">
        <div class="draw-wrap">
          <canvas id="draw" width="300" height="300"></canvas>
          <div class="draw-tools">
            <span id="pens"></span>
            <button id="draw-clear" type="button">🧽</button>
            <label class="btn-like">🖼️<input id="draw-upload" type="file" accept="image/*" hidden /></label>
          </div>
        </div>
        <div class="fx">
          <input id="special-name" maxlength="24" placeholder="Name der Karte" />
          <div id="effects"></div>
          <p id="special-desc" class="desc"></p>
        </div>
      </div>
    </section>

    <section class="step">
      <h2>3 · Los</h2>
      <input id="room" maxlength="20" placeholder="Raum (leer = tisch)" />
      <button id="join" class="primary">An den Tisch</button>
      <p id="error"></p>
      <p class="hint"><a href="editor.html">✏️ Charakterkarten-Bilder hochladen</a> · <a href="/">💣 Bomb Party</a></p>
    </section>
  </main>

  <!-- ── Der Tisch ── -->
  <section id="table" hidden>
    <header id="players"></header>
    <div id="middle">
      <div id="pile-area">
        <div id="pile"></div>
        <div id="pile-info"></div>
      </div>
      <ol id="log"></ol>
    </div>
    <div id="actions">
      <button id="start" class="primary" hidden>▶️ Spiel starten</button>
      <button id="take">🗑️ Stapel nehmen</button>
      <button id="play" class="primary">Legen</button>
    </div>
    <div id="toast"></div>
    <div id="hand"></div>
  </section>

  <script type="module" src="karten.js"></script>
</body>
</html>
